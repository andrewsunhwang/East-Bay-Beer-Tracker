name: EFB Android

on:
  push:
    paths:
      - 'efb-android/**'
      - '.github/workflows/efb-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Unit tests + APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: efb-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Core unit tests
        run: ./gradlew --no-daemon -PcoreOnly=true :core:test
      - name: Build APK
        if: hashFiles('efb-android/app/build.gradle.kts') != ''
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Upload APK
        if: hashFiles('efb-android/app/build.gradle.kts') != ''
        uses: actions/upload-artifact@v4
        with:
          name: SimpleEFB-apk
          path: efb-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  emulator-smoke-test:
    name: Emulator smoke test (live FAA data)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    defaults:
      run:
        working-directory: efb-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build debug and test APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: efb-android
          script: bash ci/emulator-test.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshots
          path: efb-android/build/screens/
          if-no-files-found: ignore

  live-faa-check:
    name: Live FAA data check
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: efb-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check FAA endpoints and formats
        run: ./gradlew --no-daemon -PcoreOnly=true :core:liveCheck
      - name: Upload samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-faa-samples
          path: efb-android/core/build/live/
          if-no-files-found: ignore
